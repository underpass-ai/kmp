[package]
name = "kmp-embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "In-process KMP composition root over a stamped local SQLite store"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kmp", "embedded", "memory", "sqlite", "agents"]
categories = ["database"]
publish = true

[lints]
workspace = true

[features]
default = ["sqlite"]
# Compatibility feature name: SQLite is now the only engine for fresh stores.
sqlite = ["kmp-adapter-embedded/sqlite"]

[dependencies]
kmp-adapter-embedded.workspace = true
kmp-application.workspace = true
kmp-domain.workspace = true
kmp-memory-api.workspace = true
kmp-observability.workspace = true

[dev-dependencies]
tempfile = "3.26.0"
tokio.workspace = true
