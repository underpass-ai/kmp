[package]
name = "kmp-mcp"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Stdio MCP adapter for the Kernel Memory Protocol: durable agent memory over an embedded or remote kernel"
repository.workspace = true
readme = "README.md"
keywords = ["kmp", "mcp", "memory", "context", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[features]
# The user-facing binary ships able to open both layouts. A fresh store uses
# SQLite so two editor windows work without rebuilding or setting engine
# variables; existing redb stores continue to open from their format stamp.
default = ["sqlite"]
# Forward through kmp-embedded only. kmp-adapter-embedded is a dev-dependency
# here, and a feature that names a dev-dependency builds inside the workspace
# but fails `cargo install` — which is how a user gets this binary.
sqlite = ["kmp-embedded/sqlite"]

[dependencies]
opentelemetry.workspace = true
prost-types.workspace = true
kmp-domain.workspace = true
kmp-application.workspace = true
kmp-embedded.workspace = true
kmp-proto.workspace = true
kmp-proto-mapping.workspace = true
kmp-viewer.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls = "0.26.4"
tonic.workspace = true
tracing.workspace = true
tracing-appender = "0.2.3"
tracing-subscriber.workspace = true

[dev-dependencies]
kmp-adapter-embedded.workspace = true
tempfile = "3.26.0"
tokio-stream.workspace = true

[lints]
workspace = true
