[package]
name = "kmp-mcp"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
description = "Local-first agent memory that preserves why, exposed as typed MCP tools"
repository.workspace = true
readme = "README.md"
keywords = ["kmp", "mcp", "memory", "context", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[features]
# Compatibility feature name retained for downstream manifests. SQLite is
# always present.
default = ["sqlite"]
sqlite = ["kmp-embedded/sqlite"]

[dependencies]
opentelemetry.workspace = true
prost-types.workspace = true
kmp-domain.workspace = true
kmp-application.workspace = true
kmp-embedded.workspace = true
kmp-proto.workspace = true
kmp-proto-mapping.workspace = true
kmp-viewer.workspace = true
reqwest = { workspace = true, features = ["blocking"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-rustls = "0.26.4"
tonic.workspace = true
tracing.workspace = true
tracing-appender = "0.2.3"
tracing-subscriber.workspace = true
wait-timeout.workspace = true

[dev-dependencies]
kmp-adapter-embedded.workspace = true
tempfile = "3.26.0"
tokio-stream.workspace = true

[lints]
workspace = true
