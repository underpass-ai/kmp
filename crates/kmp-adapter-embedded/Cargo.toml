[package]
name = "kmp-adapter-embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Embedded SQLite storage adapters for every KMP persistence port"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kmp", "sqlite", "embedded", "storage", "memory"]
categories = ["database"]
publish = true

[features]
default = ["sqlite"]
# Kept as a compatibility feature name for downstream manifests. SQLite is
# always present because both canonical memory and quality telemetry use it.
sqlite = []

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
sha2.workspace = true
kmp-domain.workspace = true
kmp-application.workspace = true
kmp-observability.workspace = true
kmp-ports.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
kmp-application.workspace = true
tempfile = "3.26.0"
