sonar.organization=underpass-ai-swe-ai-fleet
sonar.projectKey=underpass-ai_rehydration-kernel
sonar.projectName=KMP by Underpass
sonar.sources=api,crates,scripts,.github/workflows
sonar.tests=crates
sonar.test.inclusions=crates/**/tests/**/*.rs,crates/**/src/**/tests.rs
# Test-support crates are intentionally excluded from analysis and coverage.
# They are exercised via container-backed integration tests, not treated as
# production Rust code for Sonar's coverage gate.
sonar.exclusions=target/**,**/Cargo.lock,crates/**/tests/**/*.rs,crates/**/src/**/tests.rs,crates/kmp-tests-paper/tests/**,crates/kmp-tests-kernel/tests/**,crates/kmp-conformance/src/**,crates/kmp-tests-shared/src/**,crates/kmp-testkit/src/**,crates/kmp-transport-grpc/src/agentic_reference/**,crates/kmp-transport-grpc/src/bin/runtime_reference_client/**,scripts/ci/extract-e2e-report.py,scripts/ci/extract-e2e-figures.py,scripts/operator/**
# Browser-only assets have no JavaScript test runner in this Rust workspace.
# Keep them in static analysis while excluding them from the Rust LCOV gate.
sonar.coverage.exclusions=scripts/**,.github/workflows/**,crates/kmp-viewer/ui/**,crates/kmp-conformance/src/**,crates/kmp-tests-shared/src/**,crates/kmp-testkit/src/**,crates/kmp-transport-grpc/src/agentic_reference/**,crates/kmp-transport-grpc/src/bin/runtime_reference_client/**
sonar.cpd.exclusions=crates/kmp-transport-grpc/src/starship_e2e.rs,scripts/operator/**
sonar.rust.lcov.reportPaths=target/llvm-cov/lcov.info
sonar.scm.provider=git

# Workspace crates use the repository-root Cargo.lock. Sonar text:S8570
# checks package manifests independently, so it misclassifies member crates.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8570
sonar.issue.ignore.multicriteria.e1.resourceKey=crates/**/Cargo.toml
