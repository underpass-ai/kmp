# Sample variant used by the tests and SCHEMAS.md section 4; not a real arm.
name = "sample-rerank"
description = "Rerank narrow from the judged cassette, against the release binary."
claim = "quality"
targets = [{ metric = "useful_rate", direction = "up", effect = 0.08 }]
guards = ["false_answer_rate", "stale_serve_rate", { metric = "core_precision", margin = 0.0 }]
n = 100
store = "shared"
jev = "replay"

[binary]
path = "target/release/kmp-mcp"

[store_files]
"rerank.json" = "scripts/performance/memory_bench/tests/fixtures/rerank-narrow.json"
"typesafe.json" = { json = { endpoint = "https://api.typesafe.ai/v1/systemone", model = "jev-1.13.0", timeout_ms = 20000 } }

[env]
KMP_TYPESAFE_CASSETTE = "crates/kmp-testkit/judged/retrieval.jev.cassette.json"
RUST_LOG = "kmp_mcp::judgement=debug"
