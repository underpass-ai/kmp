syntax = "proto3";

package underpass.rehydration.kernel.v1beta1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/underpass-ai/kmp/api/gen/go/underpass/rehydration/kernel/v1beta1;rehydrationkernelv1beta1";

service KernelMemoryService {
  rpc Ingest(IngestRequest) returns (IngestResponse);
  rpc Wake(WakeRequest) returns (WakeResponse);
  rpc Ask(AskRequest) returns (AskResponse);
  // What memories of several abouts have to do with each other, read off
  // what they share and never declared.
  rpc Relate(RelateRequest) returns (RelateResponse);
  rpc Goto(GotoRequest) returns (GotoResponse);
  rpc Near(NearRequest) returns (NearResponse);
  rpc Rewind(RewindRequest) returns (RewindResponse);
  rpc Forward(ForwardRequest) returns (ForwardResponse);
  // Range- and level-of-detail-aware visual read. This result belongs on a
  // renderer/data channel, not in an agent's model context.
  rpc ProjectVisual(ProjectVisualRequest) returns (ProjectVisualResponse);
  rpc Trace(TraceRequest) returns (TraceResponse);
  rpc Inspect(InspectRequest) returns (InspectResponse);
}

message IngestRequest {
  string about = 1;
  Memory memory = 2;
  MemoryProvenance provenance = 3;
  string idempotency_key = 4;
  bool dry_run = 5;
}

message Memory {
  repeated MemoryDimension dimensions = 1;
  repeated MemoryEntry entries = 2;
  repeated MemoryRelation relations = 3;
  repeated MemoryEvidence evidence = 4;
}

message MemoryDimension {
  string id = 1;
  string kind = 2;
  string title = 3;
  map<string, string> metadata = 4;
}

message MemoryEntry {
  string id = 1;
  string kind = 2;
  string text = 3;
  repeated TemporalCoordinate coordinates = 4;
  map<string, string> metadata = 5;
}

message TemporalCoordinate {
  string dimension = 1;
  string scope_id = 2;
  google.protobuf.Timestamp occurred_at = 3;
  google.protobuf.Timestamp observed_at = 4;
  google.protobuf.Timestamp ingested_at = 5;
  google.protobuf.Timestamp valid_from = 6;
  google.protobuf.Timestamp valid_until = 7;
  optional uint32 sequence = 8;
  optional uint32 rank = 9;
  map<string, string> metadata = 10;
}

message MemoryRelation {
  string source_ref = 1;
  string target_ref = 2;
  string rel = 3;
  MemorySemanticClass semantic_class = 4;
  string why = 5;
  string evidence = 6;
  MemoryConfidence confidence = 7;
  optional uint32 sequence = 8;
  MemoryRelationExplanation explanation = 9;
  // Canonical MemoryEvidence ids that support this hop. When a relation's
  // textual why/evidence is identical to a Proof.evidence body, the body is
  // stored only in that registry and this field carries the join.
  repeated string evidence_refs = 10;
}

// Typed fields that qualify the relation itself. The top-level `why`,
// `evidence`, `confidence`, and `sequence` fields remain for compatibility;
// this message carries the rest of RelationExplanation, including the
// relation's own temporal validity coordinate.
message MemoryRelationExplanation {
  string motivation = 1;
  string method = 2;
  string decision_id = 3;
  string caused_by_node_id = 4;
  TemporalCoordinate coordinate = 5;
}

message MemoryEvidence {
  string id = 1;
  repeated string supports = 2;
  string text = 3;
  string source = 4;
  google.protobuf.Timestamp time = 5;
  map<string, string> metadata = 6;
}

message MemoryProvenance {
  MemorySourceKind source_kind = 1;
  string source_agent = 2;
  google.protobuf.Timestamp observed_at = 3;
  string correlation_id = 4;
  string causation_id = 5;
}

message IngestResponse {
  string summary = 1;
  IngestedMemory memory = 2;
  repeated string warnings = 3;
}

message IngestedMemory {
  string about = 1;
  string memory_id = 2;
  AcceptedCounts accepted = 3;
  bool read_after_write_ready = 4;
}

message AcceptedCounts {
  uint32 entries = 1;
  uint32 relations = 2;
  uint32 evidence = 3;
}

message WakeRequest {
  string about = 1;
  string role = 2;
  string intent = 3;
  MemoryBudget budget = 4;
  DimensionSelection dimensions = 5;
  // Continuation of the canonical recall projection. The cursor is bound to
  // the same request, snapshot and ordered eligible selection.
  PageRequest page = 6;
  // Wake at one instant, within a half-open span, on one clock. The three
  // mean what they mean on AskRequest: `as_of` and `interval` are exclusive,
  // and `axis` has nothing to select on without one of them.
  TemporalCursor as_of = 7;
  TemporalInterval interval = 8;
  TemporalAxis axis = 9;
}

message WakeResponse {
  string summary = 1;
  WakePacket wake = 2;
  Proof proof = 3;
  repeated string warnings = 4;
  // The newest coordinate this packet covers, when the memory carries one.
  // Save it and hand it to Forward next time to receive only what is new:
  // catching up is the second question anyone asks of a memory, and without
  // this it took an extra call whose only purpose was to recover a timestamp.
  // The cursor is the caller's to carry — the kernel does not track readers.
  optional TemporalCursor resume_cursor = 5;
  RecallProjection projection = 6;
  RecallTruncation truncation = 7;
  // The catalogue of the abouts this wake read: every (key, value) pair
  // their entries stand in, with how many stand in it and the latest
  // instant any was observed. Read it before labelling a new memory, so a
  // writer reuses what exists instead of guessing what to call it. The
  // current about comes first, then by use. The most used labels are the
  // first expansion the packet fills, ahead of the state lines beyond the
  // first; the rest follow the causal spine, and `truncation` reports what
  // did not fit. Nothing of the core is shortened to make room for a label.
  repeated MemoryLabel labels = 8;
}

// One label an about's memory carries: a `dimension` kind read as the key
// and a `scope_id` read as the value, exactly the pair every coordinate
// names. `entries` counts the entries that stand in it and
// `last_observed_at` is the latest observed instant among them.
message MemoryLabel {
  string about = 1;
  string key = 2;
  string value = 3;
  uint32 entries = 4;
  google.protobuf.Timestamp last_observed_at = 5;
}

message WakePacket {
  string objective = 1;
  repeated string current_state = 2;
  repeated WakeClaim causal_spine = 3;
  repeated string open_loops = 4;
  repeated string next_actions = 5;
  repeated string guardrails = 6;
}

message WakeClaim {
  string claim = 1;
  string because = 2;
  string evidence_ref = 3;
}

message AskRequest {
  string about = 1;
  string question = 2;
  AnswerPolicy answer_policy = 3;
  MemoryBudget budget = 4;
  DimensionSelection dimensions = 5;
  PageRequest page = 6;
  // The user's own words when `question` is the agent's rendering of them in
  // the kernel's search language. The kernel translates nothing: it searches
  // `question`, echoes `asked_as` for the audit trail, and warns when the
  // rendering leans to another language or drops an identifier the user's
  // words carry.
  string asked_as = 7;
  // Ask at one instant: only what was in effect then on `axis` competes, and
  // the lifecycles — supersession, expiry — are read as they stood then, so
  // an entry replaced or expired later is current for this question. A ref
  // cursor stands at that entry's own instant on the axis. Exclusive with
  // `interval`.
  TemporalCursor as_of = 8;
  // Ask within a half-open span on `axis`: only what falls inside competes,
  // the collection the ranker weighs is the span's own, and an UNKNOWN names
  // the nearest match outside it. Exclusive with `as_of`.
  TemporalInterval interval = 9;
  // The clock `as_of` and `interval` are read on. UNSPECIFIED keeps the
  // compatible precedence. An axis alone has nothing to select on.
  TemporalAxis axis = 10;
}

message AskResponse {
  string summary = 1;
  string answer = 2;
  repeated AnswerReason because = 3;
  Proof proof = 4;
  repeated string warnings = 5;
  RecallProjection projection = 6;
  RecallTruncation truncation = 7;
  // `AskRequest.asked_as`, echoed byte for byte so a response says what the
  // user asked as well as what the kernel searched. Empty when none was given.
  string asked_as = 8;
}

message AnswerReason {
  string claim = 1;
  // Deprecated for recall responses. The canonical full body lives once in
  // Proof.evidence; use `ref` to join it. Kept on the v1beta1 wire so existing
  // generated clients remain compatible.
  string evidence = 2;
  // Canonical Proof.evidence.id.
  string ref = 3;
}

// Shared temporal movement payload shape used by transport adapters. Public
// RPCs use method-specific request messages so gRPC contracts stay explicit.
message TemporalMoveRequest {
  string about = 1;
  TemporalCursor cursor = 2;
  DimensionSelection dimensions = 3;
  TemporalWindow window = 4;
  TemporalLimit limit = 5;
  TemporalInclude include = 6;
  MemoryBudget budget = 7;
  TemporalAxis axis = 8;
}

message GotoRequest {
  string about = 1;
  TemporalCursor cursor = 2;
  DimensionSelection dimensions = 3;
  TemporalWindow window = 4;
  TemporalLimit limit = 5;
  TemporalInclude include = 6;
  MemoryBudget budget = 7;
  TemporalAxis axis = 8;
}

message RewindRequest {
  string about = 1;
  TemporalCursor cursor = 2;
  DimensionSelection dimensions = 3;
  TemporalWindow window = 4;
  TemporalLimit limit = 5;
  TemporalInclude include = 6;
  MemoryBudget budget = 7;
  TemporalAxis axis = 8;
}

message ForwardRequest {
  string about = 1;
  TemporalCursor cursor = 2;
  DimensionSelection dimensions = 3;
  TemporalWindow window = 4;
  TemporalLimit limit = 5;
  TemporalInclude include = 6;
  MemoryBudget budget = 7;
  TemporalAxis axis = 8;
}

// Shared temporal neighborhood payload shape used by transport adapters. Public
// RPCs use NearRequest.
message TemporalNearRequest {
  string about = 1;
  TemporalCursor around = 2;
  DimensionSelection dimensions = 3;
  TemporalWindow window = 4;
  TemporalLimit limit = 5;
  TemporalInclude include = 6;
  MemoryBudget budget = 7;
  TemporalAxis axis = 8;
}

message NearRequest {
  string about = 1;
  TemporalCursor around = 2;
  DimensionSelection dimensions = 3;
  TemporalWindow window = 4;
  TemporalLimit limit = 5;
  TemporalInclude include = 6;
  MemoryBudget budget = 7;
  TemporalAxis axis = 8;
}

// Shared temporal response payload shape used by transport adapters. Public
// RPCs use method-specific response messages.
message TemporalMoveResponse {
  string summary = 1;
  TemporalState temporal = 2;
  TemporalCoverage coverage = 3;
  repeated TemporalEntry entries = 4;
  Proof proof = 5;
  repeated string warnings = 6;
  repeated RawMemoryRef raw_refs = 7;
  PageInfo page = 8;
  ResponseQuality quality = 9;
}

message GotoResponse {
  string summary = 1;
  TemporalState temporal = 2;
  TemporalCoverage coverage = 3;
  repeated TemporalEntry entries = 4;
  Proof proof = 5;
  repeated string warnings = 6;
  repeated RawMemoryRef raw_refs = 7;
  PageInfo page = 8;
  ResponseQuality quality = 9;
}

message NearResponse {
  string summary = 1;
  TemporalState temporal = 2;
  TemporalCoverage coverage = 3;
  repeated TemporalEntry entries = 4;
  Proof proof = 5;
  repeated string warnings = 6;
  repeated RawMemoryRef raw_refs = 7;
  PageInfo page = 8;
  ResponseQuality quality = 9;
}

message RewindResponse {
  string summary = 1;
  TemporalState temporal = 2;
  TemporalCoverage coverage = 3;
  repeated TemporalEntry entries = 4;
  Proof proof = 5;
  repeated string warnings = 6;
  repeated RawMemoryRef raw_refs = 7;
  PageInfo page = 8;
  ResponseQuality quality = 9;
}

message ForwardResponse {
  string summary = 1;
  TemporalState temporal = 2;
  TemporalCoverage coverage = 3;
  repeated TemporalEntry entries = 4;
  Proof proof = 5;
  repeated string warnings = 6;
  repeated RawMemoryRef raw_refs = 7;
  PageInfo page = 8;
  ResponseQuality quality = 9;
}

message TemporalState {
  TemporalDirection direction = 1;
  TemporalCursor requested = 2;
  TemporalCoordinate resolved = 3;
  TemporalAxis axis = 4;
}

message TemporalCoverage {
  DimensionSelection requested = 1;
  repeated string included = 2;
  repeated string missing = 3;
  // Per-dimension coverage detail, for online context-coverage feedback: lets a
  // client measure the per-dimension shortfall of the retrieved context without
  // gold labels.
  repeated DimensionCoverage dimensions = 4;
}

// Per-dimension slice of TemporalCoverage. `returned` counts the entries in this
// page that carry the dimension; `present` is true when the dimension appeared
// in `included` (false when it was requested but absent).
message DimensionCoverage {
  string dimension = 1;
  uint32 returned = 2;
  bool present = 3;
}

message TemporalCursor {
  string ref = 1;
  google.protobuf.Timestamp time = 2;
  optional uint32 sequence = 3;
}

// A half-open span on one clock: `start` inclusive, `end` exclusive. Either
// bound may be left unset to leave that side open; at least one is set.
message TemporalInterval {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message TemporalEntry {
  string ref = 1;
  string kind = 2;
  string text = 3;
  repeated TemporalCoordinate coordinates = 4;
  map<string, string> metadata = 5;
}

message ProjectVisualRequest {
  string about = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  TemporalAxis axis = 4;
  DimensionSelection dimensions = 5;
  VisualLevelOfDetail level_of_detail = 6;
  uint32 bin_count = 7;
  PageRequest page = 8;
  MemoryBudget budget = 9;
}

message ProjectVisualResponse {
  string contract = 1;
  string about = 2;
  TemporalAxis axis = 3;
  VisualLevelOfDetail level_of_detail = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  repeated VisualBin bins = 7;
  repeated VisualCluster clusters = 8;
  repeated TemporalEntry entries = 9;
  repeated MemoryRelation relations = 10;
  repeated VisualMetric metrics = 11;
  TemporalCoverage coverage = 12;
  uint64 revision = 13;
  string content_hash = 14;
  PageInfo page = 15;
  bool truncated = 16;
  repeated string missing = 17;
  // Distinct entries by kind in the selected range. Per-bin and per-cluster
  // maps count lane memberships and must not be summed into global totals.
  map<string, uint32> by_kind = 18;
}

message VisualBin {
  string dimension = 1;
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  uint32 entries = 4;
  map<string, uint32> by_kind = 5;
}

message VisualCluster {
  string id = 1;
  string dimension = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
  uint32 entries = 5;
  repeated string refs = 6;
  map<string, uint32> by_kind = 7;
}

message VisualMetric {
  string name = 1;
  double value = 2;
  string unit = 3;
  string scope = 4;
}

message TraceRequest {
  string from = 1;
  string to = 2;
  string goal = 3;
  MemoryBudget budget = 4;
  PageRequest page = 5;
  string about = 6;
}

message TraceResponse {
  string summary = 1;
  repeated MemoryRelation trace = 2;
  repeated string warnings = 3;
  PageInfo page = 4;
  ResponseQuality quality = 5;
}

// Relate: what memories of several abouts have to do with each other,
// read off what they share and never declared. Abouts are joined by no
// relation, so this is read from the coordinates: the dimension scopes two
// abouts both use, and where on one clock each memory stands inside them.
message RelateRequest {
  // The current about: the read's root and the first of `abouts_selected`.
  string about = 1;
  // Which abouts to relate: `scope: abouts` names them, `all_abouts` sweeps
  // them, narrowed by dimension kind or exact scope like every other read.
  DimensionSelection dimensions = 2;
  // The half-open span the facts fall within on `axis`; open on either side.
  TemporalInterval interval = 3;
  // The clock `interval` and the coordinate relations are read on.
  TemporalAxis axis = 4;
  MemoryBudget budget = 5;
  // Continuation of a paged relate; the cursor is bound to the same
  // request and selection.
  PageRequest page = 6;
}

message RelateResponse {
  string summary = 1;
  // The entries of the selected abouts inside the interval, with the state
  // their lifecycle had at its end.
  repeated RelatedFact facts = 2;
  // The relations each about declared between its own facts, cut to the
  // interval: the graph that exists, with class, quality, why and evidence.
  repeated MemoryRelation declared = 3;
  // Relations between facts of different abouts, read off their
  // coordinates inside a scope they share.
  repeated CoordinateRelation coordinate = 4;
  // Facts that still stand and that a declared `contradicts` joins.
  repeated Tension tensions = 5;
  Proof proof = 6;
  repeated string warnings = 7;
  PageInfo page = 8;
  // Pairs of facts of different abouts the kernel proposes are about the
  // same thing, each with the signals that made it say so. Never stored:
  // a writer may declare one, with this as the proof.
  repeated ProposedLink proposed = 9;
}

// Two facts of different abouts proposed as the same thing, reproducible
// bit for bit from what both carry.
message ProposedLink {
  string from = 1;
  string to = 2;
  // The signals, strongest first: `identifier`, `summary`, `entity`.
  repeated string proposed_by = 3;
  // Identifiers both carry that are rare across the span.
  repeated string shared = 4;
  // The rarity of the strongest shared identifier across the span.
  double idf = 5;
  // Concepts both English summaries share.
  repeated string shared_terms = 6;
  // Concept pairs the lexical-bridge table crossed, as `a≈b`.
  repeated string bridged = 7;
  // Proper names both texts carry.
  repeated string entities = 8;
  // The scope both stand in, when they share one.
  string scope_id = 9;
  // The signals' weights summed, plus the shared scope.
  uint32 weight = 10;
  string why = 11;
}

// An entry as relate reads it: where it stands, which about placed it, and
// what its lifecycle said at the end of the interval.
message RelatedFact {
  string ref = 1;
  string about = 2;
  string kind = 3;
  string text = 4;
  repeated TemporalCoordinate coordinates = 5;
  FactState state = 6;
  // What replaced it, when `state` is SUPERSEDED.
  string superseded_by = 7;
  // When it ran out, when `state` is EXPIRED.
  google.protobuf.Timestamp valid_until = 8;
  map<string, string> metadata = 9;
}

enum FactState {
  FACT_STATE_UNSPECIFIED = 0;
  FACT_STATE_CURRENT = 1;
  FACT_STATE_SUPERSEDED = 2;
  FACT_STATE_EXPIRED = 3;
}

// How two facts of different abouts stand to each other inside a scope
// they share. Read, not declared, and said in `why`.
message CoordinateRelation {
  string from = 1;
  string to = 2;
  CoordinateRelationKind kind = 3;
  // The scope both stand in, stripped of the about that namespaces it.
  string scope_id = 4;
  TemporalAxis axis = 5;
  string why = 6;
}

enum CoordinateRelationKind {
  COORDINATE_RELATION_KIND_UNSPECIFIED = 0;
  // They share the scope and neither carries an instant on the clock read.
  COORDINATE_RELATION_KIND_SHARES_SCOPE = 1;
  COORDINATE_RELATION_KIND_BEFORE = 2;
  COORDINATE_RELATION_KIND_AFTER = 3;
  // `from` holds within the span of `to`, on the validity clock.
  COORDINATE_RELATION_KIND_DURING = 4;
  // The same instant, or overlapping spans.
  COORDINATE_RELATION_KIND_CONCURRENT = 5;
  COORDINATE_RELATION_KIND_SAME_SEQUENCE = 6;
  COORDINATE_RELATION_KIND_SAME_RANK = 7;
}

// Two facts that both still stand and that a declared `contradicts` joins.
// Shown, never resolved.
message Tension {
  string ref = 1;
  string other = 2;
  // The scope both stand in, when they share one.
  string scope_id = 3;
  string why = 4;
  string evidence = 5;
}

message InspectRequest {
  string ref = 1;
  InspectInclude include = 2;
  string about = 3;
}

message InspectResponse {
  string summary = 1;
  InspectedObject object = 2;
  InspectedLinks links = 3;
  repeated MemoryEvidence evidence = 4;
  repeated string warnings = 5;
  repeated RawMemoryRef raw = 6;
  ResponseQuality quality = 7;
}

message InspectedObject {
  string ref = 1;
  string kind = 2;
  string text = 3;
  map<string, string> metadata = 4;
  string source = 5;
}

message InspectedLinks {
  repeated MemoryRelation incoming = 1;
  repeated MemoryRelation outgoing = 2;
}

message RawMemoryRef {
  string ref = 1;
  string kind = 2;
  string text = 3;
  repeated TemporalCoordinate coordinates = 4;
  string detail = 5;
  string content_hash = 6;
  uint64 revision = 7;
}

message Proof {
  repeated MemoryRelation path = 1;
  repeated MemoryEvidence evidence = 2;
  repeated string conflicts = 3;
  repeated string missing = 4;
  MemoryConfidence confidence = 5;
  // Refs this recall reached that a later entry replaced, and what replaced
  // them. Kept apart from `conflicts` on purpose: `contradicts` says two
  // entries disagree and both may still be live, which is the information;
  // `supersedes` says one replaced the other, so the older is history rather
  // than advice. Folding them together would make every revert read as an
  // unresolved disagreement.
  repeated SupersededMemory superseded = 7;
  // Count of unresolved required-context nodes the proof still depends on
  // (currently the size of `missing`). A non-zero frontier means necessary
  // context has not yet been reached.
  uint32 frontier_size = 6;
  // Informative query terms retained by the selected answer evidence and its
  // directly supporting semantic graph context. These explain eligibility;
  // scoring thresholds and internal weights remain implementation details.
  repeated string matched_terms = 8;
  // Non-structural relation types whose rationale, evidence or endpoints
  // contributed retained query terms to the selected answer.
  repeated string matched_relations = 9;
  // Entries whose validity interval had already ended when this response was
  // read. Kept apart from supersession because an interval can expire without
  // another entry replacing it, so following `supersedes` never finds one.
  //
  // What "already ended" is measured against depends on the read: a temporal
  // move compares against the cursor the caller asked for, on whichever clock
  // it asked on; wake and ask have no cursor and compare against the latest
  // instant the memory itself knows about.
  //
  // What each verb then does with it also differs, and all three are honest.
  // A temporal move on a recorded clock returns the entry, because history is
  // what it was asked for, and names it here; an as-of read on the validity
  // clock leaves it out and names it here. Wake returns it ranked behind what
  // stands. Ask withholds it and reports it here, so the exclusion is not
  // silent.
  repeated ExpiredMemory expired = 10;
  // The span this recall stood within, when the caller asked for one.
  TemporalInterval interval = 11;
  // The clock `as_of` or `interval` was read on, as the caller named it;
  // UNSPECIFIED is the compatible precedence.
  TemporalAxis axis = 12;
  // On UNKNOWN within an interval: the best match outside it, so a reader
  // can tell "not then" from "not known".
  NearestOutside nearest_outside = 13;
  // The instant this recall stood at, when the caller asked for one; a ref
  // cursor is reported as the instant it resolved to.
  google.protobuf.Timestamp as_of = 14;
  // The abouts this recall read together, the current one first: one when
  // `dimensions.scope` stayed inside it, the named list or every anchor
  // otherwise. Each cited ref already carries its about; this says which
  // were looked at, so silence from one is distinguishable from absence.
  repeated string abouts_selected = 15;
  // Of those, the abouts with no entry inside the interval or in effect at
  // the instant, when the caller asked for one. Empty otherwise.
  repeated string abouts_empty_in_selection = 16;
}

// One entry replaced by another, so a reader can tell history from advice.
message SupersededMemory {
  // The entry that was replaced.
  string ref = 1;
  // The entry that replaced it.
  string superseded_by = 2;
  // Why, taken from the relation that carries it.
  string why = 3;
}

// One entry whose exclusive validity end is at or before the instant the read
// is measured against: the caller's cursor on a temporal move, the memory's
// own latest known instant on wake and ask.
message ExpiredMemory {
  string ref = 1;
  google.protobuf.Timestamp valid_until = 2;
}

// The closest match outside the interval a recall was bounded to.
message NearestOutside {
  string ref = 1;
  // Its instant on the clock the recall read.
  google.protobuf.Timestamp time = 2;
  // The clock that instant was read from. Never UNSPECIFIED here: the
  // compatible precedence resolves to one clock per entry.
  TemporalAxis axis = 3;
}

// Per-response quality/composition summary, promoted from OTel so a client can
// read it in-band and feed an online context-coverage estimator. Counts and
// ratios describe THIS response only (not aggregate system health). Ratios are
// in [0.0, 1.0].
message ResponseQuality {
  uint32 nodes = 1;
  uint32 relationships = 2;
  uint32 details = 3;
  double detail_coverage = 4;
  double causal_density = 5;
  bool truncated = 6;
}

message MemoryBudget {
  // Compatibility planning hint reported back to callers. Projection is
  // bounded normatively by max_bytes; this field does not filter expansion.
  uint32 tokens = 1;
  MemoryDetailLevel detail = 2;
  uint32 depth = 3;
  // Cap on the number of evidence entries Wake or Ask surfaces (0 = unbounded).
  // Wake applies it in graph-traversal order; Ask applies it after relevance
  // filtering. Both report withheld sources through proof.missing and
  // proof.frontier_size so the client can expand deliberately.
  uint32 max_entries = 4;
  // Normative ceiling for the serialized canonical recall value. Zero uses
  // the host-safe 10,000-byte default; non-zero values must be at least 512.
  uint64 max_bytes = 5;
}

// Transport-neutral accounting for the deterministic core-plus-prefix recall
// projection. Wake and Ask carry the same shape through direct gRPC and every
// MCP transport; envelopes are the only permitted difference.
message RecallProjection {
  string contract = 1;
  MemoryDetailLevel detail = 2;
  RecallProjectionBudget budget = 3;
  RecallProjectionPage page = 4;
  repeated RecallProjectionSection sections = 5;
  uint64 excluded_by_detail = 6;
  uint64 selection_omitted = 7;
  bool core_text_shortened = 8;
  optional string next_action = 9;
}

message RecallProjectionBudget {
  uint64 max_bytes = 1;
  uint64 used_bytes = 2;
  // Echo of the compatibility planning hint; not a structured-content cap.
  uint32 tokens_advisory = 3;
}

message RecallProjectionPage {
  uint64 offset = 1;
  uint64 returned = 2;
  uint64 total = 3;
  bool has_more = 4;
  optional string next_cursor = 5;
}

message RecallProjectionSection {
  string name = 1;
  uint64 core = 2;
  uint64 returned_on_page = 3;
  uint64 eligible = 4;
  uint64 total = 5;
}

message RecallTruncation {
  bool truncated = 1;
  // Echo of the compatibility planning hint; retained on the v1 wire shape.
  uint32 token_limit = 2;
  uint64 byte_limit = 3;
  RecallOmitted omitted = 4;
}

message RecallOmitted {
  uint64 page_items = 1;
  uint64 prior_page_items = 2;
  uint64 remaining_page_items = 3;
  uint64 excluded_by_detail = 4;
  uint64 selection_items = 5;
  bool core_text_shortened = 6;
}

// Machine-readable detail carried by INVALID_ARGUMENT when a Wake/Ask
// continuation cursor cannot be used. Tonic serializes this message directly
// into grpc-status-details-bin; clients can branch on `reason` without parsing
// the human diagnostic.
message RecallCursorError {
  RecallCursorErrorReason reason = 1;
  string cursor = 2;
  string message = 3;
}

enum RecallCursorErrorReason {
  RECALL_CURSOR_ERROR_REASON_UNSPECIFIED = 0;
  RECALL_CURSOR_ERROR_REASON_MALFORMED = 1;
  RECALL_CURSOR_ERROR_REASON_SELECTION_CHANGED = 2;
  RECALL_CURSOR_ERROR_REASON_OFFSET_OUT_OF_RANGE = 3;
}

message DimensionSelection {
  DimensionSelectionMode mode = 1;
  repeated string include = 2;
  repeated string exclude = 3;
  DimensionScopeMode scope = 4;
  repeated string abouts = 5;
  // Optional exact dimension scope filter. Values may be local dimension ids
  // from MemoryDimension.id or fully namespaced ids shaped as
  // about:{about}:dimension:{dimension_id}.
  repeated string scope_ids = 6;
}

message TemporalWindow {
  uint32 before_entries = 1;
  uint32 after_entries = 2;
}

message TemporalLimit {
  uint32 entries = 1;
  uint32 tokens = 2;
}

message PageRequest {
  // Maximum number of items to return in this page. Zero means service default.
  uint32 entries = 1;
  // Opaque continuation cursor returned by PageInfo.next_cursor.
  string cursor = 2;
}

message PageInfo {
  uint32 returned = 1;
  uint32 total = 2;
  bool has_more = 3;
  string next_cursor = 4;
}

message TemporalInclude {
  bool evidence = 1;
  bool relations = 2;
  bool raw_refs = 3;
}

message InspectInclude {
  bool incoming = 1;
  bool outgoing = 2;
  bool details = 3;
  bool raw = 4;
}

enum MemoryConfidence {
  MEMORY_CONFIDENCE_UNSPECIFIED = 0;
  MEMORY_CONFIDENCE_HIGH = 1;
  MEMORY_CONFIDENCE_MEDIUM = 2;
  MEMORY_CONFIDENCE_LOW = 3;
  MEMORY_CONFIDENCE_UNKNOWN = 4;
}

enum MemorySemanticClass {
  MEMORY_SEMANTIC_CLASS_UNSPECIFIED = 0;
  MEMORY_SEMANTIC_CLASS_STRUCTURAL = 1;
  MEMORY_SEMANTIC_CLASS_CAUSAL = 2;
  MEMORY_SEMANTIC_CLASS_MOTIVATIONAL = 3;
  MEMORY_SEMANTIC_CLASS_PROCEDURAL = 4;
  MEMORY_SEMANTIC_CLASS_EVIDENTIAL = 5;
  MEMORY_SEMANTIC_CLASS_CONSTRAINT = 6;
}

enum MemorySourceKind {
  MEMORY_SOURCE_KIND_UNSPECIFIED = 0;
  MEMORY_SOURCE_KIND_HUMAN = 1;
  MEMORY_SOURCE_KIND_AGENT = 2;
  MEMORY_SOURCE_KIND_PROJECTION = 3;
  MEMORY_SOURCE_KIND_DERIVED = 4;
}

enum DimensionSelectionMode {
  DIMENSION_SELECTION_MODE_UNSPECIFIED = 0;
  DIMENSION_SELECTION_MODE_ALL = 1;
  DIMENSION_SELECTION_MODE_ONLY = 2;
  DIMENSION_SELECTION_MODE_EXCEPT = 3;
}

enum DimensionScopeMode {
  DIMENSION_SCOPE_MODE_UNSPECIFIED = 0;
  DIMENSION_SCOPE_MODE_CURRENT_ABOUT = 1;
  DIMENSION_SCOPE_MODE_ABOUTS = 2;
  // Uses the kernel memory about index to traverse every memory anchor.
  DIMENSION_SCOPE_MODE_ALL_ABOUTS = 3;
}

enum TemporalDirection {
  TEMPORAL_DIRECTION_UNSPECIFIED = 0;
  TEMPORAL_DIRECTION_GOTO = 1;
  TEMPORAL_DIRECTION_NEAR = 2;
  TEMPORAL_DIRECTION_REWIND = 3;
  TEMPORAL_DIRECTION_FORWARD = 4;
}

enum TemporalAxis {
  // Preserves the compatible precedence: occurred, validity start, observed,
  // then ingested.
  TEMPORAL_AXIS_UNSPECIFIED = 0;
  TEMPORAL_AXIS_OCCURRED = 1;
  TEMPORAL_AXIS_OBSERVED = 2;
  TEMPORAL_AXIS_INGESTED = 3;
  TEMPORAL_AXIS_VALIDITY = 4;
}

enum VisualLevelOfDetail {
  VISUAL_LEVEL_OF_DETAIL_UNSPECIFIED = 0;
  VISUAL_LEVEL_OF_DETAIL_ATLAS = 1;
  VISUAL_LEVEL_OF_DETAIL_EPISODE = 2;
  VISUAL_LEVEL_OF_DETAIL_MOMENT = 3;
}

enum MemoryDetailLevel {
  MEMORY_DETAIL_LEVEL_UNSPECIFIED = 0;
  MEMORY_DETAIL_LEVEL_COMPACT = 1;
  MEMORY_DETAIL_LEVEL_BALANCED = 2;
  MEMORY_DETAIL_LEVEL_FULL = 3;
}

enum AnswerPolicy {
  ANSWER_POLICY_UNSPECIFIED = 0;
  ANSWER_POLICY_EVIDENCE_OR_UNKNOWN = 1;
  ANSWER_POLICY_SHOW_CONFLICTS = 2;
  ANSWER_POLICY_BEST_EFFORT = 3;
}
