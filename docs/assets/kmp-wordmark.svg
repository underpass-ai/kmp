<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" viewBox="0 0 760 230" role="img" aria-labelledby="title description">
  <title id="title">KMP</title>
  <desc id="description">The KMP block wordmark derived from its terminal banner</desc>
  <style>
    .main { fill: #6d28d9; }
    .shadow-near { fill: #111827; }
    .shadow-far { fill: #c4b5fd; }
    @media (prefers-color-scheme: dark) {
      .main { fill: #c4b5fd; }
      .shadow-near { fill: #080b12; }
      .shadow-far { fill: #8b5cf6; }
    }
  </style>
  <defs>
    <g id="kmp-blocks" shape-rendering="crispEdges">
      <!-- ██   ██ ███    ███ ██████ -->
      <rect x="68" y="20" width="48" height="36"/>
      <rect x="188" y="20" width="48" height="36"/>
      <rect x="260" y="20" width="72" height="36"/>
      <rect x="428" y="20" width="72" height="36"/>
      <rect x="524" y="20" width="168" height="36"/>
      <!-- ██  ██  ████  ████ ██   ██ -->
      <rect x="68" y="56" width="48" height="36"/>
      <rect x="164" y="56" width="48" height="36"/>
      <rect x="260" y="56" width="96" height="36"/>
      <rect x="404" y="56" width="96" height="36"/>
      <rect x="524" y="56" width="48" height="36"/>
      <rect x="644" y="56" width="48" height="36"/>
      <!-- █████   ██ ████ ██ ██████ -->
      <rect x="68" y="92" width="120" height="36"/>
      <rect x="260" y="92" width="48" height="36"/>
      <rect x="332" y="92" width="96" height="36"/>
      <rect x="452" y="92" width="48" height="36"/>
      <rect x="524" y="92" width="168" height="36"/>
      <!-- ██  ██  ██  ██  ██ ██ -->
      <rect x="68" y="128" width="48" height="36"/>
      <rect x="164" y="128" width="48" height="36"/>
      <rect x="260" y="128" width="48" height="36"/>
      <rect x="356" y="128" width="48" height="36"/>
      <rect x="452" y="128" width="48" height="36"/>
      <rect x="524" y="128" width="48" height="36"/>
      <!-- ██   ██ ██      ██ ██ -->
      <rect x="68" y="164" width="48" height="36"/>
      <rect x="188" y="164" width="48" height="36"/>
      <rect x="260" y="164" width="48" height="36"/>
      <rect x="452" y="164" width="48" height="36"/>
      <rect x="524" y="164" width="48" height="36"/>
    </g>
  </defs>
  <use href="#kmp-blocks" class="shadow-far" transform="translate(10 10)"/>
  <use href="#kmp-blocks" class="shadow-near" transform="translate(5 5)"/>
  <use href="#kmp-blocks" class="main"/>
</svg>
