name: publish-distribution

# What a release ships: the server image, the Helm chart, and — on a `v*`
# tag only — the crate chain behind `cargo install kmp-mcp`.
#
# The `publish-crates` job at the bottom needs the repo secret
# `CARGO_REGISTRY_TOKEN`, set on an account with a verified email; crates.io
# rejects the upload otherwise. Without it the image and chart still publish.
# `workflow_dispatch` deliberately does NOT publish crates, so an operator
# re-rolling an image cannot accidentally mutate the registry.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/underpass-ai/kmp
  CHART_NAME: kmp
  CHART_REGISTRY: oci://ghcr.io/underpass-ai/charts
  CHART_PATH: distribution/charts/kmp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-marketplace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify public plugin marketplace parity for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release/verify-marketplace.py "${GITHUB_REF_NAME#v}"

  publish-image:
    needs: verify-marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-helm-chart:
    needs: verify-marketplace
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Helm
        run: bash scripts/ci/install-helm.sh

      - name: Lint chart
        run: bash scripts/ci/helm-lint.sh

      - name: Compute chart version
        id: chart-version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0-main.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare packaged chart
        shell: bash
        run: |
          mkdir -p dist/chart
          cp -R "${CHART_PATH}" "dist/chart/${CHART_NAME}"
          sed -i "s/^version: .*/version: ${VERSION}/" "dist/chart/${CHART_NAME}/Chart.yaml"
          sed -i "s/^appVersion: .*/appVersion: \"${APP_VERSION}\"/" "dist/chart/${CHART_NAME}/Chart.yaml"
          helm package "dist/chart/${CHART_NAME}" --destination dist
        env:
          VERSION: ${{ steps.chart-version.outputs.version }}
          APP_VERSION: ${{ github.sha }}

      - name: Log in to GitHub Container Registry for Helm
        shell: bash
        run: |
          echo "${TOKEN}" | helm registry login ghcr.io --username "${ACTOR}" --password-stdin
        env:
          TOKEN: ${{ secrets.GHCR_TOKEN != '' && secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          ACTOR: ${{ secrets.GHCR_USERNAME != '' && secrets.GHCR_USERNAME || github.actor }}

      - name: Push Helm chart
        shell: bash
        run: |
          helm push "dist/${CHART_NAME}-${VERSION}.tgz" "${CHART_REGISTRY}"
        env:
          VERSION: ${{ steps.chart-version.outputs.version }}

  # crates.io publish for every public crate, in dependency order.
  # `kmp-mcp` carries the embedded kernel, so the whole chain beneath it —
  # domain, ports, application, adapters, proto — has to exist on the
  # registry or cargo refuses the upload. The script owns the order, skips
  # versions already published so a half-finished release can be resumed by
  # re-running this job, and waits out the new-crate rate limit instead of
  # failing the release over it. That limit is why the timeout is what it is:
  # crates.io allows a burst of new names and then one every ten minutes, and
  # a first release introduces twelve of them.
  publish-crates:
    needs: verify-marketplace
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: publish-crates
          # cargo publish creates and removes verification trees below
          # target/package. Restoring the registry is useful here; saving or
          # cleaning the mutable target afterwards only produces false ENOENT
          # failure annotations on an otherwise successful publication.
          cache-targets: false
          save-if: false

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/ci/publish-crates.sh
