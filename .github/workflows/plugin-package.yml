name: plugin-validation

# Pull-request validation for the shared Codex / Claude Code contracts and the
# platform-specific Windows launcher. Release candidates compile and package
# every supported host; this workflow never publishes or duplicates them.

on:
  pull_request:
    paths:
      - "plugins/kmp/**"
      - "scripts/plugin/**"
      - "scripts/ci/kmp-windows-launcher-smoke.ps1"
      - "crates/kmp-release/**"
      - "scripts/ci/kmp-capability-contract.py"
      - "scripts/ci/kmp-agent-routing-contract.py"
      - "tests/plugin/**"
      - "crates/kmp-mcp/**"
      - ".github/actions/install-rust/**"
      - ".github/workflows/plugin-package.yml"
      - "scripts/ci/install-rust-toolchain.sh"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: plugin-validation

      - name: Check the plugin capability contract
        run: python3 scripts/ci/kmp-capability-contract.py

      - name: Check agent routing and language fallback
        run: python3 scripts/ci/kmp-agent-routing-contract.py

      - name: Prove the packaged canonical plugin tree
        run: cargo test --locked -p kmp-release --test plugin_package_contract

      - name: Prove plugin bootstrap, lifecycle, guide and protocol contracts
        run: |
          cargo test --locked -p kmp-mcp --test plugin_bootstrap
          cargo test --locked -p kmp-mcp --test plugin_notice
          cargo test --locked -p kmp-mcp --test lifecycle_cli
          cargo test --locked -p kmp-mcp --test lifecycle_update
          cargo test --locked -p kmp-mcp --test lifecycle_native_hosts
          cargo test --locked -p kmp-mcp --test guide_sync
          cargo test --locked -p kmp-mcp --test stdio_binary

      - name: Install native plugin managers for lifecycle convergence
        run: npm install --global @anthropic-ai/claude-code@2.1.251 @openai/codex@0.151.0

      - name: Prove clean install and 0.4.2 update on both real hosts
        run: cargo test -p kmp-mcp --test lifecycle_real_hosts -- --ignored

  windows-launcher:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install protoc
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath "$env:USERPROFILE\protoc"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\protoc\bin"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: plugin-validation

      - name: Build the launcher engine once
        shell: bash
        run: cargo build --release --locked -p kmp-mcp --features sqlite

      - name: Stage the prebuilt engine for the launcher
        shell: bash
        run: |
          KMP_PLUGIN_PREBUILT_BINARY=target/release/kmp-mcp.exe \
            bash scripts/plugin/build-local-kmp-plugin.sh

      - name: Smoke-test Windows launcher version selection
        shell: pwsh
        run: ./scripts/ci/kmp-windows-launcher-smoke.ps1
