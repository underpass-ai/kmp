name: mcp-registry

# Validation is safe on every change. Publishing is a separate, one-shot
# action: only a version tag, only after Cargo and MCPB are publicly reachable,
# only with GitHub OIDC, and only while the repository owner has explicitly
# armed MCP_REGISTRY_PUBLISH. Pull requests never receive publish authority.

on:
  pull_request:
    paths:
      - "server.json"
      - "distribution/mcpb/**"
      - "crates/kmp-mcp/README.md"
      - "crates/kmp-mcp/src/protocol.rs"
      - "scripts/ci/mcp-registry.sh"
      - "scripts/ci/install-mcp-publisher.sh"
      - "scripts/release/**"
      - "scripts/release.sh"
      - ".github/workflows/mcp-registry.yml"
      - ".github/workflows/release.yml"
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  MCP_REGISTRY: https://registry.modelcontextprotocol.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check repository-owned Registry contracts
        run: bash scripts/ci/mcp-registry.sh

      - name: Verify versioned changelog for publication
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r '.version' server.json)"
          fi
          python3 scripts/release/changelog.py check "${version}"

      - name: Verify public README parity for publication
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python3 scripts/release/sync-public-readme.py check

      - name: Verify public plugin marketplace parity for publication
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            message="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")"
            marketplace_commit="$(sed -n 's/^marketplace-commit: \([0-9a-f][0-9a-f]*\)$/\1/p' <<<"${message}")"
            [[ "${marketplace_commit}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "annotated tag ${GITHUB_REF_NAME} does not name a marketplace commit" >&2
              exit 1
            }
            python3 scripts/release/verify-marketplace.py "${version}" \
              --marketplace-commit "${marketplace_commit}"
          else
            version="$(jq -r '.version' server.json)"
            python3 scripts/release/verify-marketplace.py "${version}"
          fi

      - name: Install the checksummed official publisher
        run: bash scripts/ci/install-mcp-publisher.sh "${RUNNER_TEMP}/mcp-publisher"

      - name: Dry-run against the staging Registry
        run: PATH="${RUNNER_TEMP}/mcp-publisher:${PATH}" bash scripts/ci/mcp-registry.sh

      - name: Validate the MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate distribution/mcpb/manifest.json

  publish:
    needs: validate
    if: vars.MCP_REGISTRY_PUBLISH == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: mcp-registry-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for the immutable Cargo and MCPB packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(jq -r '.version' server.json)"
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match server.json ${VERSION}" >&2
            exit 1
          fi
          for attempt in $(seq 1 360); do
            cargo_ready=0
            mcpb_ready=0
            curl --proto '=https' --tlsv1.2 -A 'kmp-mcp-release-check/0.1 (+https://github.com/underpass-ai/kmp)' -fsSL \
              "https://crates.io/api/v1/crates/kmp-mcp/${VERSION}" >/dev/null \
              && cargo_ready=1 || true
            gh release view "${TAG}" --json assets \
              --jq ".assets[].name" 2>/dev/null \
              | grep -qx "kmp-mcp-${TAG}.mcpb" \
              && mcpb_ready=1 || true
            if [[ "${cargo_ready}" == 1 && "${mcpb_ready}" == 1 ]]; then
              exit 0
            fi
            echo "waiting for packages (attempt ${attempt}: cargo=${cargo_ready}, mcpb=${mcpb_ready})"
            sleep 30
          done
          echo "Cargo or MCPB package did not become available before timeout" >&2
          exit 1

      - name: Verify the released MCPB matches server.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r '.version' server.json)"
          tag="v${version}"
          mkdir -p "${RUNNER_TEMP}/mcpb"
          gh release download "${tag}" \
            --pattern "kmp-mcp-${tag}.mcpb" \
            --dir "${RUNNER_TEMP}/mcpb"
          expected="$(python3 -c 'import json; print(next(p["fileSha256"] for p in json.load(open("server.json"))["packages"] if p["registryType"] == "mcpb"))')"
          actual="$(sha256sum "${RUNNER_TEMP}/mcpb/kmp-mcp-${tag}.mcpb" | awk '{print $1}')"
          [[ "${actual}" == "${expected}" ]] || {
            echo "released MCPB ${actual} does not match server.json ${expected}" >&2
            exit 1
          }

      - name: Install the checksummed official publisher
        run: bash scripts/ci/install-mcp-publisher.sh "${RUNNER_TEMP}/mcp-publisher"

      - name: Authenticate and publish with GitHub OIDC
        run: |
          publisher="${RUNNER_TEMP}/mcp-publisher/mcp-publisher"
          "${publisher}" login github-oidc --registry="${MCP_REGISTRY}"
          "${publisher}" publish server.json
