              // can leave it completed/skipped forever even after every
              // Analyze (*) run is green. Once analyses exist they alone are
              // authoritative. Before they appear, a terminal aggregate with
              // success/neutral/skipped means there is nothing left to wait
              // for (for example a configuration-only or skipped scan).
