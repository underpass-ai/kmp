name: quality-gate

on:
  pull_request:
    # The defaults plus ready_for_review: a draft leaving draft state is the
    # moment the full gate takes over from the dev loop, and without this
    # type the handover would wait for the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # A merge to main usually lands a tree byte-identical to the pull request
  # head that was just proved green: same tree, different commit. Compiling
  # and testing it again proves nothing, and doubles the exposure to the
  # intermittent container failures in #30 — every false red on a tree that
  # was green minutes earlier trains the reflex to re-run rather than read.
  #
  # The rule is "skip when this tree was already proved", never "trust the
  # pull request". A merge from an out-of-date branch, a conflict resolved in
  # the UI and a direct push all produce trees nobody tested, and each still
  # gets the full gate. So does any doubt at all.
  tree-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.proof.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Was this tree already proved green?
        id: proof
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/tree-already-proved.sh quality-gate.yml

  # Pull requests pay only for the parts of the product they can affect. The
  # planner derives the reverse workspace dependency closure, then routes the
  # independent documentation, adapter, container, chart and publication
  # contracts. Unknown paths and changes to this router fail closed to the
  # full matrix. workflow_dispatch is also deliberately full.
  # Draft pull requests are development mode: the dev-loop workflow answers
  # them in minutes, and the full gate stands down by skipping this router —
  # every downstream job needs one of its outputs, so they all stand down
  # with it. Marking the pull request ready for review runs everything, and
  # branch protection still requires the full gate before a merge.
  impact:
    needs: tree-proof
    if: >-
      needs.tree-proof.outputs.skip != 'true'
      && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      actions: ${{ steps.plan.outputs.actions }}
      vendored: ${{ steps.plan.outputs.vendored }}
      publish: ${{ steps.plan.outputs.publish }}
      rustfmt: ${{ steps.plan.outputs.rustfmt }}
      rust: ${{ steps.plan.outputs.rust }}
      docs: ${{ steps.plan.outputs.docs }}
      test: ${{ steps.plan.outputs.test }}
      valkey: ${{ steps.plan.outputs.valkey }}
      neo4j: ${{ steps.plan.outputs.neo4j }}
      nats: ${{ steps.plan.outputs.nats }}
      embedded_binary: ${{ steps.plan.outputs.embedded_binary }}
      embedded_sqlite: ${{ steps.plan.outputs.embedded_sqlite }}
      conformance: ${{ steps.plan.outputs.conformance }}
      agentic_context: ${{ steps.plan.outputs.agentic_context }}
      agentic_event_context: ${{ steps.plan.outputs.agentic_event_context }}
      full_journey: ${{ steps.plan.outputs.full_journey }}
      mcp_real: ${{ steps.plan.outputs.mcp_real }}
      container: ${{ steps.plan.outputs.container }}
      helm: ${{ steps.plan.outputs.helm }}
      coverage: ${{ steps.plan.outputs.coverage }}
      codeql: ${{ steps.plan.outputs.codeql }}
      cargo_packages: ${{ steps.plan.outputs.cargo_packages }}
    steps:
      - name: Checkout complete history for the change boundary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Prove the routing matrix
        run: |
          python3 scripts/ci/quality-gate-plan.py --self-test
          python3 scripts/ci/merge-coverage.py --self-test
          python3 scripts/ci/quality-workflow-contract.py

      - name: Plan required gates
        id: plan
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            python3 scripts/ci/quality-gate-plan.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}" \
              --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci/quality-gate-plan.py --full \
              --github-output "${GITHUB_OUTPUT}"
          fi
  # contract: temporarily removed while proto field pruning baseline stabilizes.
  # Restore from git history (commit af4c6a6) once breaking change window closes.

  actions-runtime:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.actions == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: External actions use reviewed immutable runtime pins
        run: python3 scripts/ci/github-actions-contract.py

      - name: Release publication keeps its reviewed cache policy
        run: python3 scripts/ci/publish-workflow-contract.py

  # Parts of the contract live twice — authored under api/, vendored into
  # the crates that have to be publishable. This keeps them one contract.
  # No toolchain, no protoc: it is a diff, and it runs in seconds.
  vendored-contract:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.vendored == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Vendored proto and fixtures match the contract
        run: bash scripts/ci/check-vendored-contract.sh

  # The release publishes a fixed chain of crates to crates.io. This is what
  # keeps that chain honest between releases, when a crate is added or its
  # dependencies move — a check on a pull request, rather than a discovery
  # halfway through a publish that cannot be rolled back.
  publish-chain:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Publish chain matches the workspace
        run: bash scripts/ci/check-publish-chain.sh

  rustfmt:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.rustfmt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust
        with:
          components: clippy

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Run clippy
        run: cargo clippy ${{ needs.impact.outputs.cargo_packages }} --all-targets --locked -- -D warnings

  test:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        if: needs.impact.outputs.rust == 'true'
        uses: ./.github/actions/install-coverage

      - name: Install protoc
        if: needs.impact.outputs.rust == 'true'
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        if: needs.impact.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Reset coverage counters
        if: needs.impact.outputs.rust == 'true'
        run: cargo llvm-cov clean --workspace

      - name: Run tests
        if: needs.impact.outputs.rust == 'true'
        run: cargo llvm-cov --no-report ${{ needs.impact.outputs.cargo_packages }} --locked

      - name: Publish unit-test coverage
        if: needs.impact.outputs.rust == 'true'
        uses: ./.github/actions/upload-coverage
        with:
          name: unit

      - name: Documentation spine
        if: needs.impact.outputs.docs == 'true'
        run: bash scripts/ci/documentation-spine.sh

      - name: kmp-mcp architecture gate
        run: bash scripts/ci/kmp-mcp-architecture-gate.sh

  integration-valkey:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.valkey == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-coverage

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Reset coverage counters
        run: cargo llvm-cov clean --workspace

      - name: Run Valkey integration tests
        env:
          KMP_COLLECT_COVERAGE: true
        run: bash scripts/ci/integration-valkey.sh

      - name: Publish Valkey coverage
        uses: ./.github/actions/upload-coverage
        with:
          name: valkey

  integration-neo4j:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.neo4j == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-coverage

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Reset coverage counters
        run: cargo llvm-cov clean --workspace

      - name: Run Neo4j integration tests
        env:
          KMP_COLLECT_COVERAGE: true
        run: bash scripts/ci/integration-neo4j.sh

      - name: Publish Neo4j coverage
        uses: ./.github/actions/upload-coverage
        with:
          name: neo4j

  integration-nats:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.nats == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-coverage

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Reset coverage counters
        run: cargo llvm-cov clean --workspace

      - name: Run NATS integration tests
        env:
          KMP_COLLECT_COVERAGE: true
        run: bash scripts/ci/integration-nats.sh

      - name: Publish NATS coverage
        uses: ./.github/actions/upload-coverage
        with:
          name: nats

  embedded-binary-gates:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.embedded_binary == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Enforce embedded binary gates
        run: bash scripts/ci/embedded-binary-gates.sh

  embedded-sqlite-gates:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.embedded_sqlite == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sqlite-gates

      # The opt-in SQLite engine (ADR-018): conformance, crash recovery and
      # the two-process scenario, with the feature compiled in. The default
      # build's gates above prove the engine did not leak into it.
      - name: Enforce embedded SQLite engine gates
        run: bash scripts/ci/embedded-sqlite-gates.sh

  integration-conformance:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.conformance == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Run KMP conformance suite against infrastructure adapters
        run: bash scripts/ci/integration-conformance.sh

  integration-agentic-context:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.agentic_context == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-coverage

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Reset coverage counters
        run: cargo llvm-cov clean --workspace

      - name: Run agentic context integration tests
        env:
          KMP_COLLECT_COVERAGE: true
        run: bash scripts/ci/integration-agentic-context.sh

      - name: Publish agentic-context coverage
        uses: ./.github/actions/upload-coverage
        with:
          name: agentic-context

  integration-agentic-event-context:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.agentic_event_context == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-coverage

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Reset coverage counters
        run: cargo llvm-cov clean --workspace

      - name: Run event-driven agentic integration tests
        env:
          KMP_COLLECT_COVERAGE: true
        run: bash scripts/ci/integration-agentic-event-context.sh

      - name: Publish agentic-event coverage
        uses: ./.github/actions/upload-coverage
        with:
          name: agentic-event-context

  integration-kernel-full-journey:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.full_journey == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-coverage

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Reset coverage counters
        run: cargo llvm-cov clean --workspace

      - name: Run full-journey integration tests
        env:
          KMP_COLLECT_COVERAGE: true
        run: bash scripts/ci/integration-kernel-full-journey.sh

      - name: Run TLS full-journey integration tests
        env:
          KMP_COLLECT_COVERAGE: true
        run: bash scripts/ci/integration-kernel-full-journey-tls.sh

      - name: Publish full-journey coverage
        uses: ./.github/actions/upload-coverage
        with:
          name: full-journey

  integration-mcp-real-kernel:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.mcp_real == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Verify Docker
        run: docker version

      - name: Run MCP real-kernel integration smoke
        run: bash scripts/ci/integration-mcp-real-kernel.sh

  container-image:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.container == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Docker
        run: docker version

      - name: Build container image
        run: bash scripts/ci/container-image.sh

  helm-chart:
    needs: [tree-proof, impact]
    if: needs.tree-proof.outputs.skip != 'true' && needs.impact.outputs.helm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Helm
        run: bash scripts/ci/install-helm.sh

      - name: Lint Helm chart
        run: bash scripts/ci/helm-lint.sh

  coverage:
    needs:
      - tree-proof
      - impact
      - test
      - integration-valkey
      - integration-neo4j
      - integration-nats
      - integration-agentic-context
      - integration-agentic-event-context
      - integration-kernel-full-journey
    if: >-
      always()
      && needs.tree-proof.outputs.skip != 'true'
      && needs.impact.result == 'success'
      && needs.impact.outputs.coverage == 'true'
      && needs.test.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: dist/coverage
          merge-multiple: true

      # Coverage is a reducer, not a second test suite. The upstream jobs each
      # run their tests once with LLVM instrumentation and upload LCOV. This
      # job only merges those reports and enforces the repository threshold.
      - name: Merge coverage and enforce threshold
        run: bash scripts/ci/rust-coverage.sh dist/coverage

  wait-codeql-checks:
    needs: [tree-proof, impact]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Code scanning default setup does not run its per-language analyses on
    # Dependabot pull requests; it publishes only a neutral `CodeQL` aggregate.
    # Waiting for named per-language analyses there guarantees a 10-minute
    # timeout and a red gate on every dependency bump, without adding any
    # security signal. `dependency-review` is the gate that covers what those
    # pull requests actually change, and it stays required.
    if: >-
      always() && github.event_name == 'pull_request'
      && github.actor != 'dependabot[bot]'
      && needs.tree-proof.outputs.skip != 'true'
      && needs.impact.outputs.codeql == 'true'
      && !(github.event.pull_request.head.repo.fork || false)
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for CodeQL checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const isCodeQlAnalysis = (name) => name.startsWith("Analyze (");

            const deadline = Date.now() + (10 * 60 * 1000);
            const discoveryDeadline = Date.now() + (60 * 1000);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (Date.now() < deadline) {
              // Code scanning default setup emits one run per configuration
              // (security and code quality), so a single check name can map to
              // several check runs on the same commit. Keeping only one of them
              // would let a failing analysis hide behind a passing namesake, so
              // every run under a required name has to be accounted for.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const states = new Map();
              for (const run of checkRuns) {
                const runsForName = states.get(run.name) ?? [];
                runsForName.push({ id: run.id, status: run.status, conclusion: run.conclusion });
                states.set(run.name, runsForName);
              }

              const pending = [];
              const failures = [];
              let analysisRuns = 0;

              const describe = (name, run) =>
                (states.get(name) ?? []).length > 1
                  ? `${name}#${run.id}=${run.conclusion}`
                  : `${name}=${run.conclusion}`;

              // Which per-language analyses run depends on how code scanning
              // default setup is configured for this repository, so discover
              // them from the checks themselves rather than naming them here.
