name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # contract: temporarily removed while proto field pruning baseline stabilizes.
  # Restore from git history (commit af4c6a6) once breaking change window closes.

  # Parts of the contract live twice — authored under api/, vendored into
  # the crates that have to be publishable. This keeps them one contract.
  # No toolchain, no protoc: it is a diff, and it runs in seconds.
  vendored-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Vendored proto and fixtures match the contract
        run: bash scripts/ci/check-vendored-contract.sh

  # The release publishes a fixed chain of crates to crates.io. This is what
  # keeps that chain honest between releases, when a crate is added or its
  # dependencies move — a check on a pull request, rather than a discovery
  # halfway through a publish that cannot be rolled back.
  publish-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Publish chain matches the workspace
        run: bash scripts/ci/check-publish-chain.sh

  rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run tests
        run: cargo test --workspace --locked

  integration-valkey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run Valkey integration tests
        run: bash scripts/ci/integration-valkey.sh

  integration-neo4j:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run Neo4j integration tests
        run: bash scripts/ci/integration-neo4j.sh

  embedded-binary-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Enforce embedded binary gates
        run: bash scripts/ci/embedded-binary-gates.sh

  integration-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run KMP conformance suite against infrastructure adapters
        run: bash scripts/ci/integration-conformance.sh

  integration-agentic-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run agentic context integration tests
        run: bash scripts/ci/integration-agentic-context.sh

  integration-agentic-event-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run event-driven agentic integration tests
        run: bash scripts/ci/integration-agentic-event-context.sh

  integration-mcp-real-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run MCP real-kernel integration smoke
        run: bash scripts/ci/integration-mcp-real-kernel.sh

  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Docker
        run: docker version

      - name: Build container image
        run: bash scripts/ci/container-image.sh

  helm-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Helm
        run: bash scripts/ci/install-helm.sh

      - name: Lint Helm chart
        run: bash scripts/ci/helm-lint.sh

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@b81531fd070ace482ba6b315eb6c35611e1c37d3
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      # The script owns the threshold: it ends in `cargo llvm-cov report
      # --fail-under-lines`, so the gate is self-contained and needs no
      # external service to decide pass or fail.
      - name: Run coverage gate
        run: bash scripts/ci/rust-coverage.sh

  wait-codeql-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Code scanning default setup does not run its per-language analyses on
    # Dependabot pull requests; it publishes only a neutral `CodeQL` aggregate.
    # Waiting for named per-language analyses there guarantees a 10-minute
    # timeout and a red gate on every dependency bump, without adding any
    # security signal. `dependency-review` is the gate that covers what those
    # pull requests actually change, and it stays required.
    if: >-
      always() && github.event_name == 'pull_request'
      && github.actor != 'dependabot[bot]'
      && !(github.event.pull_request.head.repo.fork || false)
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for CodeQL checks
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const requiredChecks = new Map([
              ["CodeQL", "success"],
            ]);
            const isCodeQlAnalysis = (name) => name.startsWith("Analyze (");

            const deadline = Date.now() + (10 * 60 * 1000);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (Date.now() < deadline) {
              // Code scanning default setup emits one run per configuration
              // (security and code quality), so a single check name can map to
              // several check runs on the same commit. Keeping only one of them
              // would let a failing analysis hide behind a passing namesake, so
              // every run under a required name has to be accounted for.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const states = new Map();
              for (const run of checkRuns) {
                const runsForName = states.get(run.name) ?? [];
                runsForName.push({ id: run.id, status: run.status, conclusion: run.conclusion });
                states.set(run.name, runsForName);
              }

              const pending = [];
              const failures = [];

              const describe = (name, run) =>
                (states.get(name) ?? []).length > 1
                  ? `${name}#${run.id}=${run.conclusion}`
                  : `${name}=${run.conclusion}`;

              // Which per-language analyses run depends on how code scanning
              // default setup is configured for this repository, so discover
              // them from the checks themselves rather than naming them here.
              // A hard-coded language that is not enabled never publishes a
              // check, and the wait can only end in a timeout. The `CodeQL`
              // aggregate below is what decides when the analysis is done.
              for (const [analysisName, runsForName] of states) {
                if (!isCodeQlAnalysis(analysisName)) {
                  continue;
                }

                for (const run of runsForName) {
                  if (run.status !== "completed") {
                    pending.push(analysisName);
                  } else if (run.conclusion !== "success") {
                    failures.push(describe(analysisName, run));
                  }
                }
              }

              for (const [name, expectedConclusion] of requiredChecks.entries()) {
                const runsForName = states.get(name) ?? [];
                if (runsForName.length === 0) {
                  pending.push(name);
                  continue;
                }

                for (const run of runsForName) {
                  if (run.status !== "completed") {
                    pending.push(name);
                    continue;
                  }

                  if (name === "CodeQL" && run.conclusion === "neutral") {
                    pending.push(name);
                    continue;
                  }

                  if (run.conclusion !== expectedConclusion) {
                    failures.push(describe(name, run));
                  }
                }
              }

              if (failures.length > 0) {
                core.setFailed(`CodeQL checks failed: ${failures.join(", ")}`);
                return;
              }

              if (pending.length === 0) {
                core.info("All CodeQL checks succeeded");
                return;
              }

              core.info(`Waiting for CodeQL checks: ${pending.join(", ")}`);
              await sleep(15000);
            }

            core.setFailed("Timed out waiting for CodeQL checks to complete");
