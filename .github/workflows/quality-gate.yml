name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # contract: temporarily removed while proto field pruning baseline stabilizes.
  # Restore from git history (commit af4c6a6) once breaking change window closes.

  rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0
          components: clippy

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Run tests
        run: cargo test --workspace --locked

  integration-valkey:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run Valkey integration tests
        run: bash scripts/ci/integration-valkey.sh

  integration-neo4j:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run Neo4j integration tests
        run: bash scripts/ci/integration-neo4j.sh

  embedded-binary-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Enforce embedded binary gates
        run: bash scripts/ci/embedded-binary-gates.sh

  integration-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run KMP conformance suite against infrastructure adapters
        run: bash scripts/ci/integration-conformance.sh

  integration-agentic-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run agentic context integration tests
        run: bash scripts/ci/integration-agentic-context.sh

  integration-agentic-event-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run event-driven agentic integration tests
        run: bash scripts/ci/integration-agentic-event-context.sh

  integration-mcp-real-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0

      - name: Install protoc
        run: bash scripts/ci/install-protoc.sh

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Verify Docker
        run: docker version

      - name: Run MCP real-kernel integration smoke
        run: bash scripts/ci/integration-mcp-real-kernel.sh

  container-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Verify Docker
        run: docker version

      - name: Build container image
        run: bash scripts/ci/container-image.sh

  helm-chart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Helm
        run: bash scripts/ci/install-helm.sh

      - name: Lint Helm chart
        run: bash scripts/ci/helm-lint.sh

  sonarcloud:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs:
      - rustfmt
      - clippy
      - test
      - integration-valkey
      - integration-neo4j
      - integration-agentic-context
      - integration-agentic-event-context
      - integration-mcp-real-kernel
      - integration-conformance
      - embedded-binary-gates
      - container-image
      - helm-chart
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_HOST_URL: https://sonarcloud.io
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      PR_FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Evaluate Sonar configuration
        id: sonar-config
        shell: bash
        run: |
          enabled=true
          reason=""

          if [ -z "${SONAR_TOKEN}" ]; then
            enabled=false
            reason="SONAR_TOKEN secret is not configured"
          elif [ "${PR_FROM_FORK}" = "true" ]; then
            enabled=false
            reason="SonarCloud scan is disabled for forked pull requests"
          fi

          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Skip SonarCloud
        if: steps.sonar-config.outputs.enabled != 'true'
        run: echo "::notice::Skipping SonarCloud. ${{ steps.sonar-config.outputs.reason }}"

      - name: Install Rust toolchain
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: 1.90.0
          components: llvm-tools-preview

      - name: Install protoc
        if: steps.sonar-config.outputs.enabled == 'true'
        run: bash scripts/ci/install-protoc.sh

      - name: Install cargo-llvm-cov
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: taiki-e/install-action@b81531fd070ace482ba6b315eb6c35611e1c37d3

      - name: Cache Rust build artifacts
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Cache Sonar packages
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Verify Docker
        if: steps.sonar-config.outputs.enabled == 'true'
        run: docker version

      - name: Generate Rust coverage
        if: steps.sonar-config.outputs.enabled == 'true'
        run: bash scripts/ci/rust-coverage.sh

      - name: SonarCloud scan
        if: steps.sonar-config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          projectBaseDir: ${{ github.workspace }}
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  wait-codeql-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: always() && github.event_name == 'pull_request' && !(github.event.pull_request.head.repo.fork || false)
    needs:
      - sonarcloud
    permissions:
      checks: read
      contents: read
    steps:
      - name: Wait for CodeQL checks
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request.head.sha;
            const requiredChecks = new Map([
              ["CodeQL", "success"],
            ]);
            const codeQlAnalysisChecks = ["Analyze (actions)", "Analyze (rust)"];

            const deadline = Date.now() + (10 * 60 * 1000);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            while (Date.now() < deadline) {
              // Code scanning default setup emits one run per configuration
              // (security and code quality), so a single check name can map to
              // several check runs on the same commit. Keeping only one of them
              // would let a failing analysis hide behind a passing namesake, so
              // every run under a required name has to be accounted for.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref,
                per_page: 100,
              });

              const states = new Map();
              for (const run of checkRuns) {
                const runsForName = states.get(run.name) ?? [];
                runsForName.push({ id: run.id, status: run.status, conclusion: run.conclusion });
                states.set(run.name, runsForName);
              }

              const pending = [];
              const failures = [];

              const describe = (name, run) =>
                (states.get(name) ?? []).length > 1
                  ? `${name}#${run.id}=${run.conclusion}`
                  : `${name}=${run.conclusion}`;

              for (const analysisName of codeQlAnalysisChecks) {
                const runsForName = states.get(analysisName) ?? [];
                if (runsForName.length === 0) {
                  pending.push(analysisName);
                  continue;
                }

                for (const run of runsForName) {
                  if (run.status !== "completed") {
                    pending.push(analysisName);
                  } else if (run.conclusion !== "success") {
                    failures.push(describe(analysisName, run));
                  }
                }
              }

              for (const [name, expectedConclusion] of requiredChecks.entries()) {
                const runsForName = states.get(name) ?? [];
                if (runsForName.length === 0) {
                  pending.push(name);
                  continue;
                }

                for (const run of runsForName) {
                  if (run.status !== "completed") {
                    pending.push(name);
                    continue;
                  }

                  if (name === "CodeQL" && run.conclusion === "neutral") {
                    pending.push(name);
                    continue;
                  }

                  if (run.conclusion !== expectedConclusion) {
                    failures.push(describe(name, run));
                  }
                }
              }

              if (failures.length > 0) {
                core.setFailed(`CodeQL checks failed: ${failures.join(", ")}`);
                return;
              }

              if (pending.length === 0) {
                core.info("All CodeQL checks succeeded");
                return;
              }

              core.info(`Waiting for CodeQL checks: ${pending.join(", ")}`);
              await sleep(15000);
            }

            core.setFailed("Timed out waiting for CodeQL checks to complete");
