              }

              if (failures.length > 0) {
                core.setFailed(`CodeQL checks failed: ${failures.join(", ")}`);
                return;
              }

              if (pending.length === 0) {
                core.info("All CodeQL checks succeeded");
                return;
              }

              core.info(`Waiting for CodeQL checks: ${pending.join(", ")}`);
              await sleep(15000);
            }

