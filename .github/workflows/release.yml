name: release

# E5 distribution has two distinct moments. workflow_dispatch builds one
# reviewed, checksummed candidate for every developer platform. A version tag
# names that candidate and promotes those exact bytes; it never recompiles.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            plugin_label: linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            plugin_label: linux-arm64
          - runner: macos-14
            target: aarch64-apple-darwin
            plugin_label: macos-arm64
          # macos-13 (Intel) runners are retired; cross-compile from arm64.
          - runner: macos-14
            target: x86_64-apple-darwin
            plugin_label: ""
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            plugin_label: windows-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-protoc.sh

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-osx-universal_binary.zip
          sudo unzip -o protoc.zip -d /usr/local bin/protoc include/*
          protoc --version

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath "$env:USERPROFILE\protoc"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\protoc\bin"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Build release binary
        shell: bash
        # MSVC otherwise writes the link time into the PE header. The version
        # branch and tag can then produce byte-different MCPBs from the same
        # tree, invalidating the hash that server.json must carry.
        env:
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C link-arg=/Brepro' || '' }}
        run: cargo build --release -p kmp-mcp --locked --features sqlite --target ${{ matrix.target }}

      - name: Package and checksum
        shell: bash
        run: |
          WORKSPACE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          VERSION="v${WORKSPACE_VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${VERSION}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace ${VERSION}" >&2
            exit 1
          fi
          case "${{ runner.os }}" in
            Windows) BIN="target/${{ matrix.target }}/release/kmp-mcp.exe"
                     OUT="kmp-mcp-${VERSION}-${{ matrix.target }}.exe" ;;
            *)       BIN="target/${{ matrix.target }}/release/kmp-mcp"
                     OUT="kmp-mcp-${VERSION}-${{ matrix.target }}"
                     strip "$BIN" || true ;;
          esac
          mkdir -p dist
          cp "$BIN" "dist/${OUT}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${OUT}" > "${OUT}.sha256"
          else
            shasum -a 256 "${OUT}" > "${OUT}.sha256"
          fi
          ls -la

      - name: Upload binary for MCPB assembly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kmp-release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Package plugin around the reviewed binary
        if: matrix.plugin_label != ''
        shell: bash
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          case "${{ runner.os }}" in
            Windows) BINARY="dist/kmp-mcp-v${VERSION}-${{ matrix.target }}.exe" ;;
            *)       BINARY="dist/kmp-mcp-v${VERSION}-${{ matrix.target }}" ;;
          esac
          KMP_PLUGIN_PREBUILT_BINARY="${BINARY}" KMP_PLUGIN_PACKAGE_RELEASE=1 \
            bash scripts/plugin/package-kmp-plugin.sh

      - name: Smoke-test Windows launcher against the candidate binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/kmp-windows-launcher-smoke.ps1

      - name: Upload candidate plugin package
        if: matrix.plugin_label != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kmp-plugin-${{ matrix.plugin_label }}
          path: |
            dist/plugin/*.tar.gz
            dist/plugin/*.sha256
          if-no-files-found: error

  mcpb:
    name: build universal MCPB
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download the five release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: kmp-release-*
          path: dist/binaries
          merge-multiple: true

      - name: Validate the MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate distribution/mcpb/manifest.json

      - name: Package the deterministic MCPB
        id: package
        shell: bash
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          bash scripts/release/package-kmp-mcpb.sh "${VERSION}" dist/binaries dist/mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info "dist/mcpb/kmp-mcp-v${VERSION}.mcpb"

      - name: Smoke-test the MCPB launcher
        shell: bash
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          mkdir -p tmp/mcpb-smoke
          python3 -m zipfile -e "dist/mcpb/kmp-mcp-v${VERSION}.mcpb" tmp/mcpb-smoke
          chmod +x tmp/mcpb-smoke/server/kmp-mcp tmp/mcpb-smoke/server/bin/*
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"mcpb-smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | KMP_MCP_BACKEND=embedded KMP_MCP_DATA_DIR="${RUNNER_TEMP}/kmp-mcpb-smoke" \
              tmp/mcpb-smoke/server/kmp-mcp > tmp/mcpb-smoke/responses.jsonl
          python3 - tmp/mcpb-smoke/responses.jsonl <<'PY'
          import json, sys
          responses = {message.get("id"): message for message in map(json.loads, open(sys.argv[1]))}
          tools = responses.get(2, {}).get("result", {}).get("tools", [])
          if len(tools) != 10:
              raise SystemExit(f"MCPB smoke expected ten tools, found {len(tools)}")
          print("MCPB launcher started ten tools")
          PY

      - name: Download the four candidate plugin packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: kmp-plugin-*
          path: dist/plugins
          merge-multiple: true

      - name: Assemble the immutable release candidate
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          python3 scripts/release/release-candidate.py assemble \
            --version "${VERSION}" \
            --binaries dist/binaries \
            --plugins dist/plugins \
            --mcpb dist/mcpb \
            --output dist/candidate

      - name: Upload MCPB as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kmp-mcpb-${{ steps.package.outputs.version }}
          path: |
            dist/mcpb/*.mcpb
            dist/mcpb/*.sha256
          if-no-files-found: error

      - name: Upload the complete release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kmp-release-candidate-${{ steps.package.outputs.version }}
          path: dist/candidate
          if-no-files-found: error

  promote:
    name: promote reviewed candidate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the tagged release tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve the candidate named by the annotated tag
        id: candidate
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          WORKSPACE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          [[ "${VERSION}" == "${WORKSPACE_VERSION}" ]] || {
            echo "tag ${GITHUB_REF_NAME} does not match workspace ${WORKSPACE_VERSION}" >&2
            exit 1
          }
          MESSAGE="$(git for-each-ref --format='%(contents)' "refs/tags/${GITHUB_REF_NAME}")"
          RUN_ID="$(sed -n 's/^candidate-run: \([0-9][0-9]*\)$/\1/p' <<<"${MESSAGE}")"
          [[ -n "${RUN_ID}" ]] || {
            echo "annotated tag ${GITHUB_REF_NAME} does not name candidate-run" >&2
            exit 1
          }
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download the approved candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: kmp-release-candidate-${{ steps.candidate.outputs.version }}
          path: dist/candidate
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.run_id }}

      - name: Verify release inputs, provenance and every asset
        run: |
          python3 scripts/release/release-candidate.py verify \
            --version "${{ steps.candidate.outputs.version }}" \
            --run-id "${{ steps.candidate.outputs.run_id }}" \
            --directory dist/candidate

      - name: Publish the candidate bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/candidate/assets/* --clobber
