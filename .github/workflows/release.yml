name: release

# E5 distribution: a version tag produces stripped, checksummed binaries for
# every developer platform, combines them into one portable MCPB, and attaches
# both forms to the GitHub release.
# `workflow_dispatch` runs the same build matrix without publishing, so the
# pipeline is verifiable without cutting a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
          # macos-13 (Intel) runners are retired; cross-compile from arm64.
          - runner: macos-14
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install Rust toolchain
        uses: ./.github/actions/install-rust
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-protoc.sh

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL -o protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-osx-universal_binary.zip
          sudo unzip -o protoc.zip -d /usr/local bin/protoc include/*
          protoc --version

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v25.3/protoc-25.3-win64.zip" -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath "$env:USERPROFILE\protoc"
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\protoc\bin"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5

      - name: Build release binary
        shell: bash
        run: cargo build --release -p kmp-mcp --locked --features sqlite --target ${{ matrix.target }}

      - name: Package and checksum
        shell: bash
        run: |
          WORKSPACE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          VERSION="v${WORKSPACE_VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${VERSION}" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace ${VERSION}" >&2
            exit 1
          fi
          case "${{ runner.os }}" in
            Windows) BIN="target/${{ matrix.target }}/release/kmp-mcp.exe"
                     OUT="kmp-mcp-${VERSION}-${{ matrix.target }}.exe" ;;
            *)       BIN="target/${{ matrix.target }}/release/kmp-mcp"
                     OUT="kmp-mcp-${VERSION}-${{ matrix.target }}"
                     strip "$BIN" || true ;;
          esac
          mkdir -p dist
          cp "$BIN" "dist/${OUT}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${OUT}" > "${OUT}.sha256"
          else
            shasum -a 256 "${OUT}" > "${OUT}.sha256"
          fi
          ls -la

      - name: Upload binary for MCPB assembly
        uses: actions/upload-artifact@v4
        with:
          name: kmp-release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

  mcpb:
    name: build universal MCPB
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Download the five release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: kmp-release-*
          path: dist/binaries
          merge-multiple: true

      - name: Validate the MCPB manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate distribution/mcpb/manifest.json

      - name: Package the deterministic MCPB
        id: package
        shell: bash
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          bash scripts/release/package-kmp-mcpb.sh "${VERSION}" dist/binaries dist/mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info "dist/mcpb/kmp-mcp-v${VERSION}.mcpb"

      - name: Smoke-test the MCPB launcher
        shell: bash
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          mkdir -p tmp/mcpb-smoke
          python3 -m zipfile -e "dist/mcpb/kmp-mcp-v${VERSION}.mcpb" tmp/mcpb-smoke
          chmod +x tmp/mcpb-smoke/server/kmp-mcp tmp/mcpb-smoke/server/bin/*
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"mcpb-smoke","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | KMP_MCP_BACKEND=embedded KMP_MCP_DATA_DIR="${RUNNER_TEMP}/kmp-mcpb-smoke" \
              tmp/mcpb-smoke/server/kmp-mcp > tmp/mcpb-smoke/responses.jsonl
          python3 - tmp/mcpb-smoke/responses.jsonl <<'PY'
          import json, sys
          responses = {message.get("id"): message for message in map(json.loads, open(sys.argv[1]))}
          tools = responses.get(2, {}).get("result", {}).get("tools", [])
          if len(tools) != 10:
              raise SystemExit(f"MCPB smoke expected ten tools, found {len(tools)}")
          print("MCPB launcher started ten tools")
          PY

      - name: Upload MCPB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kmp-mcpb-${{ steps.package.outputs.version }}
          path: |
            dist/mcpb/*.mcpb
            dist/mcpb/*.sha256
          if-no-files-found: error

      - name: Attach MCPB to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/mcpb/* --clobber
