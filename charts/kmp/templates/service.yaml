apiVersion: v1
kind: Service
metadata:
  name: {{ include "kmp.fullname" . }}
  labels:
    {{- include "kmp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "kmp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      protocol: TCP
      targetPort: grpc
